[package]
name = "filterpack_rs"
version = "0.1.0"
edition = "2021"
description = "filterpack v1 loader (M-D1): the shared engine loader, exposed to Python via PyO3 so Rust and Python read a pack byte-identically (same canonical_digest)."
publish = false

[lib]
name = "filterpack_rs"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310: one stable-ABI wheel runs on CPython 3.10+ (matches binaural_kernel).
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
serde_json = "1"
sha2 = "0.10"
hound = "3.5"

[profile.release]
opt-level = 3
