[package]
name = "render_core"
version = "0.1.0"
edition = "2021"
description = "World-lock render core (R0 strangler): steering + crossfade DSP ported from live_render.py, bit-exact, exposed to Python via PyO3."
publish = false

[lib]
name = "render_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"
# The pure-Rust convolution core (shared with binaural_kernel), so the full per-block render
# (BusMixer + grid conv + LFE) composes in Rust — the engine's hot loop with no Python in it.
binaural_conv = { path = "../rust-conv-core" }
# The pure-Rust render logic (BusMixer + GridRender + LFE), shared with the standalone engine binary
# so there is a single implementation; this crate is the PyO3 shim over it.
render_core_lib = { path = "../rust-render-core-lib" }

[profile.release]
opt-level = 3
