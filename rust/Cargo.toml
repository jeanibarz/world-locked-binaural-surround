[package]
name = "binaural_kernel"
version = "0.1.0"
edition = "2021"
description = "Native batched partitioned-convolution render kernel for binaural-headtracker (B8.2)"
publish = false

[lib]
name = "binaural_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
realfft = "3.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
