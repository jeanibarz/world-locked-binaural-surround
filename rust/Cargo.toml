[package]
name = "binaural_kernel"
version = "0.1.0"
edition = "2021"
description = "Native batched partitioned-convolution render kernel for binaural-headtracker (B8.2)"
publish = false

[lib]
name = "binaural_kernel"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310: one stable-ABI wheel per platform runs on CPython 3.10+ (incl. the newest).
# generate-import-lib: synthesize the Windows `python3.lib` so the abi3 wheel cross-compiles
# from Linux/WSL (via cargo-xwin) without a Windows Python install.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }
numpy = "0.22"
realfft = "3.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
