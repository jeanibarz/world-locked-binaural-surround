# Separate maturin-built PyO3 extension (B8.2). The main project stays a pure-Python
# setuptools package; this crate is an OPTIONAL native accelerator (like the `gpu`
# extra), built into the venv with `maturin develop -m rust/Cargo.toml --release`.
# It is NOT part of the Python wheel and never required on CI — tests import it with
# `pytest.importorskip("binaural_kernel")`.
[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "binaural_kernel"
version = "0.1.0"
description = "Native render kernel (PyO3) for binaural-headtracker"
requires-python = ">=3.10,<3.13"
classifiers = ["Private :: Do Not Upload"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "binaural_kernel"
