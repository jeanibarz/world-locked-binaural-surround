[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binaural-headtracker"
version = "0.1.0"
description = "Real-time, head-tracked, world-locked binaural renderer (Python prototype)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
# No open-source licence is applied yet: the project targets a donationware /
# closed release (see docs/requirements.md § 9). Do NOT add a `license` field or
# LICENSE file until that decision is made. Keep every dependency permissive
# (MIT/BSD/Apache); flag GPL in the research journal before adding it.
authors = [{ name = "Jean IBARZ", email = "ibarz.jean@gmail.com" }]
dependencies = [
    # Core numerics for the render-engine prototype. Heavy, platform-specific
    # audio/vision deps (sounddevice, mediapipe, sofar/python-sofa) are added by
    # the spike blocks (B0.2–B0.4, B1.1) that first need them, each recorded with
    # its licence in the journal — kept out of the baseline so `uv sync` stays
    # fast and portable on CI/WSL where no audio device or camera exists.
    "numpy>=1.24",
    "scipy>=1.11",
    # SOFA (HDF5) HRIR reading is core to the render engine (M1) and fully
    # cross-platform with no hardware, so h5py is a baseline dep (BSD-3-Clause),
    # mirroring the sibling binaural-localization project which parses SOFA the
    # same way. SOFA = HDF5; no dedicated SOFA library is needed.
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]
# Audio-I/O spike dependency (B0.2). sounddevice (MIT) wraps PortAudio (MIT) and
# exposes WASAPI on Windows. Kept OUT of the baseline and dev extras so `uv sync`
# stays green on headless WSL/CI with no audio device; install it on the Windows
# host that runs spikes/b0_2_audio_io.py (`py -3.12 -m pip install sounddevice`)
# or here with `uv sync --extra audio`.
audio = [
    "sounddevice>=0.5",
]
# Head-tracker spike dependencies (B0.4). mediapipe (Apache-2.0) runs
# FaceLandmarker; opencv-python (Apache-2.0) grabs webcam frames. Kept OUT of the
# baseline and dev extras so `uv sync` stays green on headless WSL/CI with no
# camera; install on the Windows host that runs spikes/b0_4_head_tracker.py
# (`py -3.12 -m pip install mediapipe opencv-python`) or here with
# `uv sync --extra vision`. The portable pose/latency math in
# binaural_headtracker.head_pose needs neither and is unit-tested without them.
vision = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
]
# Passthrough capture dependency (B4.1). pyaudiowpatch (MIT) is a Windows-only fork
# of PyAudio that exposes WASAPI **loopback** — the only way to tap the raw pre-mix
# 7.1 stream apps send into the virtual device (VoiceMeeter downmixes its own output
# bus to stereo; see journal 24). The platform marker makes it a no-op off Windows, so
# `uv sync --extra loopback` stays green on CI/WSL; install on the host that runs
# apps/voicemeeter_passthrough.py.
loopback = [
    "pyaudiowpatch>=0.2; platform_system == 'Windows'",
]
# GPU render dependency (B4.1/B4.2) — OPTIONAL. Pure-Python convolution of 8ch of a 500 ms
# BRIR is ~0.97x RT (too slow); CuPy on an RTX-class GPU does ~6x RT. No longer required: the
# native Rust kernel (B8.2, built via rust/) renders it on CPU at ~5x RT — prefer `--rust`.
# cupy-cuda12x needs a consistent CUDA-12 runtime in site-packages —
# see AGENTS.md "GPU compute" for the exact nvidia-*-cu12 wheel set and the
# `\\wsl.localhost` cwd gotcha. Host-only; never installed on CI.
gpu = [
    "cupy-cuda12x>=13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Prototype in Python first (requirements § 5); keep it clean from the start.
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic default set: pyflakes (F), pycodestyle (E/W), isort (I),
# pyupgrade (UP), flake8-bugbear (B). Expand as the codebase grows.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.uv]
package = true
