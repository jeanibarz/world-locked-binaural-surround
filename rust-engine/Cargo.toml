[package]
name = "wlbs_engine"
version = "0.1.0"
edition = "2021"
description = "The standalone zero-Python world-lock binaural engine: loopback-captures a 7.1 source, world-lock renders it to binaural on the native kernel, outputs via WASAPI, and serves the web cockpit — one Rust binary, no interpreter."
publish = false

[[bin]]
name = "wlbs_engine"
path = "src/main.rs"

[dependencies]
render_core_lib = { path = "../rust-render-core-lib" }
binaural_conv = { path = "../rust-conv-core" }
control_plane = { path = "../rust-control-plane" }
serde_json = { version = "1", features = ["preserve_order"] }
hound = "3.5"

# WASAPI audio I/O is Windows-only; on other targets the engine builds (for the pack/geometry unit
# tests) but main() prints a notice.
[target.'cfg(windows)'.dependencies]
audio_io = { path = "../rust-audio-io" }
# The Rust-native head-pose pipeline (ONNX via ort) — the zero-Python tracker.
vision_client = { path = "../rust-vision-client", features = ["inference"] }
# Minimal blocking HTTP (no TLS) to pull the camera MJPEG frames that feed the pose pipeline.
ureq = { version = "2.12.1", default-features = false }
# Direct webcam capture (MediaFoundation on Windows) — the product's default pose frame source.
# `input-native` selects the OS-native backend (no extra runtime); frames decode to RGB for the
# same pose pipeline the MJPEG path uses.
nokhwa = { version = "0.10", features = ["input-native"] }

[profile.release]
opt-level = 3
